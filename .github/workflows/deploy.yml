name: Deploy to EC2 (dev)

# dev 브랜치에 push(머지 포함)되면 자동 실행
on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 21 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. 빌드 (테스트 제외 - 배포 속도 위해. 테스트 포함하려면 -x test 제거)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5. 빌드된 JAR을 EC2로 전송
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2   # build/libs/ 경로 제거하고 파일만 전송

      # 6. EC2에서 기존 프로세스 종료 후 새 JAR 실행
      - name: Deploy and restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 실행 중인 앱 종료 (있으면)
            sudo fuser -k 8080/tcp || true
            sleep 5

            # plain.jar(라이브러리용, 실행 불가)이 아닌 실제 부트 JAR만 선택
            JAR_FILE=$(ls -t /home/ubuntu/app/*.jar | grep -v plain | head -n 1)
            echo "실행할 JAR: $JAR_FILE"

            # 백그라운드 실행 (로그는 app.log에 기록)
            nohup java -jar \
              -Dspring.profiles.active=prod \
              "$JAR_FILE" > /home/ubuntu/app/app.log 2>&1 &

            sleep 10
            echo "배포 완료. 최근 로그:"
            tail -n 20 /home/ubuntu/app/app.log
